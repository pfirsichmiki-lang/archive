<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三木晋吉 資料アーカイブ</title>
<meta name="description" content="これまでの掲載記事や手元に残していた資料をまとめています。各項目をクリックすると原本が開きます。">
<meta property="og:title" content="三木晋吉 資料アーカイブ">
<meta property="og:description" content="これまでの掲載記事や手元に残していた資料をまとめています。各項目をクリックすると原本が開きます。">
<meta property="og:type" content="website">
<link rel="canonical" href="https://pfirsichmiki-lang.github.io/archive/">
<meta property="og:url" content="https://pfirsichmiki-lang.github.io/archive/">
<meta property="og:image" content="https://pfirsichmiki-lang.github.io/archive/thumbs/waseda-gakuin-panel-2017-global-society-pdf-aeb25493.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#edede7;
  --ink:#16181a;
  --ink-soft:#5b5f5c;
  --rule:#c7c9c0;
  --cyan:#1f5c86;
  --ochre:#9c6b2f;
  --gap:clamp(14px,2.2vw,26px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px; line-height:1.75;
  background-image:linear-gradient(rgba(31,92,134,.055) 1px,transparent 1px);
  background-size:100% 64px;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(18px,4vw,44px)}
a{color:inherit}

header.masthead{padding:clamp(46px,8vw,92px) 0 30px;border-bottom:2px solid var(--ink)}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--cyan);margin:0 0 18px
}
h1.site-title{
  font-family:"Shippori Mincho B1",serif;font-weight:700;
  font-size:clamp(38px,7.5vw,74px);line-height:1.06;letter-spacing:.01em;margin:0
}
.site-title .en{
  display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;
  font-size:clamp(11px,1.5vw,14px);letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink-soft);margin-top:16px
}
.lead{max-width:52ch;margin:26px 0 0;color:var(--ink-soft)}
.ledger{
  display:flex;flex-wrap:wrap;gap:0 34px;margin-top:30px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)
}
.ledger b{color:var(--ink);font-weight:500}

.controls{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:14px 0;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center
}
.search{
  flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:9px;
  border:1px solid var(--rule);background:#f6f6f1;padding:9px 13px
}
.search input{
  border:0;background:transparent;flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink)
}
.search input:focus{outline:none}
.search svg{flex:none;stroke:var(--ink-soft)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 14px;border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
  cursor:pointer;transition:background .16s,color .16s,border-color .16s
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:focus-visible,.search:focus-within{outline:2px solid var(--cyan);outline-offset:2px}

.sheet{
  display:grid;gap:var(--gap);padding:var(--gap) 0 80px;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr))
}
.frame[hidden]{display:none}
.frame{
  display:flex;flex-direction:column;text-decoration:none;
  background:#f7f7f2;border:1px solid var(--rule);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s,box-shadow .22s
}
.frame:hover,.frame:focus-visible{
  transform:translateY(-4px);border-color:var(--ink);
  box-shadow:6px 6px 0 rgba(22,24,26,.09);outline:none
}
.frame:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.sprocket{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 10px;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-soft)
}
.sprocket .no{color:var(--cyan)}
.sprocket .kind{color:var(--ochre);text-transform:uppercase}
.shot{
  position:relative;aspect-ratio:4/3;overflow:hidden;background:#fff;
  display:flex;align-items:center;justify-content:center
}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot .missing{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft)}
.caption{padding:11px 12px 14px;border-top:1px solid var(--rule)}
.caption h2{
  font-family:"Shippori Mincho B1",serif;font-size:15px;font-weight:500;line-height:1.45;
  margin:0;word-break:break-word
}
.caption .note{font-size:12.5px;color:var(--ink-soft);margin:5px 0 0}
.caption .meta{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;
  color:var(--ink-soft);margin:9px 0 0;display:flex;flex-wrap:wrap;gap:0 10px
}
.empty{
  grid-column:1/-1;padding:70px 0;text-align:center;color:var(--ink-soft);
  font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em
}

.lightbox{
  position:fixed;inset:0;z-index:90;background:rgba(20,22,20,.94);
  display:none;align-items:center;justify-content:center;padding:24px
}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border:1px solid #333}
.lb-bar{
  position:absolute;left:0;right:0;bottom:0;padding:16px 24px;color:#dcdcd4;
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap
}
.lb-bar a{color:#8fc4e8}
.lb-close{
  position:absolute;top:16px;right:20px;background:none;border:1px solid #555;color:#dcdcd4;
  font:inherit;font-size:13px;padding:6px 13px;cursor:pointer
}
.lb-close:hover{border-color:#dcdcd4}

footer{border-top:2px solid var(--ink);padding:26px 0 60px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-soft)}

@media (max-width:520px){
  .sheet{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  body{background-size:100% 48px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .frame:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <p class="eyebrow">Catalogue &nbsp;/&nbsp; 目録</p>
  <h1 class="site-title">三木晋吉 資料アーカイブ<span class="en">Shinkichi Mike Miki — Archive</span></h1>
  <p class="lead">これまでの掲載記事や手元に残していた資料をまとめています。各項目をクリックすると原本が開きます。</p>
  <p class="ledger">
    <span>収録 <b>11</b> 点</span>
    <span>画像 <b>0</b></span>
    <span>PDF <b>11</b></span>
    <span>更新 <b>2026-08-27</b></span>
  </p>
</header>

<div class="controls">
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="題名・メモ・ファイル名で絞り込む" autocomplete="off">
  </label>
  <div class="chips" id="filters">
    <button class="chip" data-filter="all" aria-pressed="true">すべて</button>
    <button class="chip" data-filter="image" aria-pressed="false">画像</button>
    <button class="chip" data-filter="pdf" aria-pressed="false">PDF</button>
  </div>
</div>

<main class="sheet" id="sheet">
